name: dashink
description: "Dashink"
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.12.1

dependencies:
  audioplayers: ^6.8.1
  bloc: ^9.2.1
  dio: ^5.11.1
  easy_localization: ^3.0.8
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  gal: ^2.3.3
  get_it: ^9.3.0
  go_router: ^18.1.3
  image: ^4.12.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  purchases_flutter: ^10.19.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  json_serializable: ^6.15.2
  very_good_analysis: ^10.3.0
  flutter_gen_runner: ^5.15.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/colors/
    - assets/icons/
    - assets/images/
    - assets/mock/
    - assets/sounds/
    - assets/translations/

  fonts:
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: CalSans
      fonts:
        - asset: assets/fonts/CalSans-Regular.ttf

flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true
  colors:
    inputs:
      - assets/colors/colors.xml

# Uygulama ikonu: tool/app_icon/render_app_icon_test.dart üretir.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: asset_sources/app_icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: asset_sources/app_icon/android_background.png
  adaptive_icon_foreground: asset_sources/app_icon/android_foreground.png
